# Reusable workflow: variable server rewrite checks.
# Called by ci.yml. Do not add push/pull_request triggers here.
#
# Runs tools/vs-ci.sh in three builds:
#   plain  conformance suite, SIM_test_varserv, VS unit tests; must pass
#   asan   the same under AddressSanitizer + UndefinedBehaviorSanitizer
#   tsan   the same under ThreadSanitizer
#
# Phase 0: the sanitizer jobs record the old server's reports and do not
# fail on them (continue-on-error). Later phases make them gates.
#
# Phase 5: each build also runs the conformance suite (with every
# known-defect test, which must pass), SIM_test_varserv and a soak against
# the rewritten server (TRICK_VS_REWRITE=1). The tsan soak is the Phase 5
# exit test: 8 clients in mixed modes and a checkpoint reload every 10 s for
# 10 minutes.
#
# The core job builds libtrick_var_server on its own (it needs only a C++17
# compiler and GoogleTest) on each supported floor: GCC 8.5 on Rocky 8, GCC
# and Clang on Ubuntu, Apple Clang on macOS. These jobs must pass. The tests
# include the golden replay: the new encoders against the Phase 0 captures.
# The core-sanitizers job runs the same tests under ASan+UBSan and under TSan
# (Clang); it must pass too.
#
# The fuzz job runs the libFuzzer targets (Clang) for a few minutes each: the
# command parser, the encoders and the line reader. The Phase 2 exit run was
# one hour on the parser with no crash.
name: Variable Server

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: vs core ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rocky8-gcc8.5
            runner: ubuntu-24.04
            container: rockylinux/rockylinux:8
            install: |
              dnf install -y 'dnf-command(config-manager)'
              dnf config-manager --enable powertools
              dnf install -y gcc-c++ make cmake gtest-devel
            cxx: g++
          - name: ubuntu24-gcc
            runner: ubuntu-24.04
            container: ""
            install: sudo apt-get update -qq && sudo apt-get install -y cmake g++ libgtest-dev
            cxx: g++
          - name: ubuntu24-clang
            runner: ubuntu-24.04
            container: ""
            install: sudo apt-get update -qq && sudo apt-get install -y cmake clang libgtest-dev
            cxx: clang++
          - name: macos
            runner: macos-26
            container: ""
            install: brew install googletest
            cxx: clang++
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compiler
        run: ${{ matrix.cxx }} --version
      - name: No iostreams
        run: tools/vs-check-no-iostreams.sh ${{ matrix.cxx }}
      - name: Build
        run: |
          cmake -S trick_source/trick_utils/var_server -B build-vs-core \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build-vs-core --parallel
      - name: Test
        run: ctest --test-dir build-vs-core --output-on-failure
      - name: Golden cases are current
        if: matrix.name == 'ubuntu24-gcc'
        run: python3 tools/vs-export-golden-cases.py --check

  core-sanitizers:
    name: vs core ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: asan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined
          - kind: tsan
            flags: -fsanitize=thread
    steps:
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake clang libclang-rt-18-dev libgtest-dev libudunits2-dev
      - name: Allow ThreadSanitizer address layout
        if: matrix.kind == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S trick_source/trick_utils/var_server -B build-vs-core \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_CXX_FLAGS=-Werror -fno-omit-frame-pointer ${{ matrix.flags }}" \
            "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
          cmake --build build-vs-core --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-vs-core --output-on-failure

  fuzz:
    name: vs fuzz
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake clang libclang-rt-18-dev
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S trick_source/trick_utils/var_server -B build-vs-fuzz \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTRICK_VS_FUZZ=ON -DBUILD_TESTING=OFF
          cmake --build build-vs-fuzz --parallel
      - name: Fuzz the command parser (5 minutes)
        run: |
          mkdir -p fuzz-out/parser-corpus
          cp trick_source/trick_utils/var_server/fuzz/corpus/command_parser/* fuzz-out/parser-corpus/
          build-vs-fuzz/fuzz/vs_command_parser_fuzz -max_total_time=300 \
            -dict=trick_source/trick_utils/var_server/fuzz/command_parser.dict \
            -artifact_prefix=fuzz-out/ fuzz-out/parser-corpus
      - name: Fuzz the encoders (5 minutes)
        run: |
          mkdir -p fuzz-out/encoders-corpus
          build-vs-fuzz/fuzz/vs_encoders_fuzz -max_total_time=300 -max_len=8192 \
            -artifact_prefix=fuzz-out/ fuzz-out/encoders-corpus
      - name: Fuzz the line reader (5 minutes)
        run: |
          mkdir -p fuzz-out/line-reader-corpus
          build-vs-fuzz/fuzz/vs_line_reader_fuzz -max_total_time=300 -max_len=4096 \
            -artifact_prefix=fuzz-out/ fuzz-out/line-reader-corpus
      - name: Upload crashes
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vs-fuzz-crashes
          path: |
            fuzz-out/crash-*
            fuzz-out/leak-*
            fuzz-out/timeout-*
          if-no-files-found: ignore
          retention-days: 14

  vs:
    name: vs ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.kind != 'plain' }}
    strategy:
      fail-fast: false
      matrix:
        kind: [plain, asan, tsan]
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bison clang flex git llvm make cmake zip \
            g++ libclang-dev llvm-dev \
            libxml2-dev libmotif-dev libxt-dev \
            perl libdigest-md5-perl libudunits2-dev zlib1g-dev \
            python3-dev python3-venv swig \
            libgtest-dev libgmock-dev
      - name: Allow ThreadSanitizer address layout
        if: matrix.kind == 'tsan'
        # TSan in GCC 13 cannot map its shadow memory with the runner's
        # default ASLR entropy.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Trick
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
          ./configure --disable-java
      - name: Run variable server checks
        env:
          VS_SOAK_MINUTES: ${{ matrix.kind == 'tsan' && '10' || '2' }}
        run: tools/vs-ci.sh ${{ matrix.kind }}
      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vs-${{ matrix.kind }}
          path: |
            vs-ci-${{ matrix.kind }}/*.md
            vs-ci-${{ matrix.kind }}/*.log
            vs-ci-${{ matrix.kind }}/sanitizer_logs/
            test/SIM_vs_conformance/conformance_logs/
            trick_test/*.xml
          if-no-files-found: warn
          retention-days: 14
