name: trick2

on:
  push:
    paths:
      - 'trick2/**'
      - '.github/workflows/trick2.yml'
  pull_request:
    paths:
      - 'trick2/**'
      - '.github/workflows/trick2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: trick2
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gcc:16.1
            preset: native
          - image: gcc:13
            preset: bootstrap
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/trick2-build-tools
          /tmp/trick2-build-tools/bin/pip install cmake==4.1.3
          echo /tmp/trick2-build-tools/bin >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2
      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix /tmp/trick2-install
