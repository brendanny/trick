name: ICG baseline tooling

on:
  push:
    branches: [master, icg-rewrite]
    paths:
      - 'tools/icg_baseline/**'
      - 'tools/icg_policy/**'
      - 'tools/icg_emit/**'
      - 'trick_source/codegen/Interface_Code_Gen/**'
      - 'trick_source/sim_services/UdUnits/**'
      - 'include/trick/**'
      - 'bin/trick-gte'
      - 'libexec/trick/pm/gte.pm'
      - 'test/**'
      - '.github/workflows/icg-baseline.yml'
  pull_request:
    paths:
      - 'tools/icg_baseline/**'
      - 'tools/icg_policy/**'
      - 'tools/icg_emit/**'
      - 'trick_source/codegen/Interface_Code_Gen/**'
      - 'trick_source/sim_services/UdUnits/**'
      - 'include/trick/**'
      - 'bin/trick-gte'
      - 'libexec/trick/pm/gte.pm'
      - 'test/**'
      - '.github/workflows/icg-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Harness / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Test bounded policy rules
        run: python -m unittest tools.icg_policy.test_resolve.RuleTests -v
      - name: Test evidence collector
        run: python -m unittest discover -s tools/icg_baseline -v
      - name: Validate regression corpus
        run: python tools/icg_baseline/baseline.py list

  legacy:
    name: Legacy headers / LLVM 17 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the reference legacy toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ perl \
            clang-17=1:17.0.6-9ubuntu1 llvm-17-dev=1:17.0.6-9ubuntu1 \
            libclang-17-dev=1:17.0.6-9ubuntu1 libclang-cpp17-dev=1:17.0.6-9ubuntu1 \
            libudunits2-dev=2.2.28-7build1
          test "$(llvm-config-17 --version)" = 17.0.6
          mkdir -p build/legacy-baseline
          dpkg-query -W > build/legacy-baseline/packages.txt
      - name: Build unchanged legacy ICG without installing Trick
        run: |
          cmake -S tools/icg_baseline/legacy -B build/legacy-baseline \
            -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/legacy-baseline --parallel 2
      - name: Build facts extractor for live policy characterization
        run: |
          python -m pip install 'jsonschema>=4.18,<5'
          cmake -S trick_source/codegen/TrickCodeGen -B build/policy-extractor \
            -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/policy-extractor --parallel 2
      - name: Compare policy decisions with unchanged legacy ICG
        run: |
          python tools/icg_policy/characterize.py \
            --extractor build/policy-extractor/trick-icg-extract \
            --legacy build/legacy-baseline/trick-ICG-baseline \
            --udunits-xml /usr/share/xml/udunits/udunits2.xml \
            --output build/policy-evidence
      - name: Capture cold, warm, and forced output against checked-in references
        run: |
          python tools/icg_baseline/legacy.py \
            --build-dir build/legacy-baseline \
            --udunits-xml /usr/share/xml/udunits/udunits2.xml \
            --output build/legacy-evidence \
            --reference tools/icg_baseline/legacy/reference
      # Keep lifecycle reference regeneration distinct from the four existing
      # header baselines; both use the unchanged reference generator.
      - name: Reproduce the focused lifecycle reference
        run: |
          python tools/icg_baseline/legacy.py \
            --build-dir build/legacy-baseline \
            --manifest tools/icg_baseline/lifecycle/corpus.json \
            --udunits-xml /usr/share/xml/udunits/udunits2.xml \
            --output build/lifecycle-reference-evidence \
            --reference tools/icg_baseline/lifecycle/reference
      - name: Preserve logs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-header-baseline-llvm17-linux
          path: |
            build/legacy-evidence
            build/policy-evidence
            build/lifecycle-reference-evidence
            build/legacy-baseline/packages.txt
            build/legacy-baseline/build-info.txt
            build/legacy-baseline/compile_commands.json
          if-no-files-found: error
          retention-days: 30
