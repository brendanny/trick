name: ICG extractor

on:
  push:
    branches: [master, icg-rewrite]
    paths:
      - 'trick_source/codegen/TrickCodeGen/**'
      - 'tools/icg_schema/**'
      - 'tools/icg_baseline/differential.py'
      - 'tools/icg_baseline/baseline.py'
      - 'tools/icg_baseline/native*'
      - 'tools/icg_baseline/legacy/**'
      - 'include/trick/**'
      - 'trick_source/sim_services/UnitsMap/UnitsMap.cpp'
      - 'test/SIM_anon_enum/models/starter.*'
      - 'test/SIM_delete_default_constructor/models/empty.h'
      - 'test/SIM_test_ip/models/test_ip/include/EmbeddedClasses.hh'
      - '.github/workflows/icg-extractor.yml'
  pull_request:
    paths:
      - 'trick_source/codegen/TrickCodeGen/**'
      - 'tools/icg_schema/**'
      - 'tools/icg_baseline/differential.py'
      - 'tools/icg_baseline/baseline.py'
      - 'tools/icg_baseline/native*'
      - 'tools/icg_baseline/legacy/**'
      - 'include/trick/**'
      - 'trick_source/sim_services/UnitsMap/UnitsMap.cpp'
      - 'test/SIM_anon_enum/models/starter.*'
      - 'test/SIM_delete_default_constructor/models/empty.h'
      - 'test/SIM_test_ip/models/test_ip/include/EmbeddedClasses.hh'
      - '.github/workflows/icg-extractor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extractor:
    name: LLVM ${{ matrix.llvm }} / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        llvm: [17, 18, 19, 20, 21, 22, 23]
        python: ['3.11']
        linkage: [AUTO]
        include:
          - {os: ubuntu-24.04, llvm: 17, python: '3.12', linkage: COMPONENTS}
          - {os: ubuntu-24.04, llvm: 22, python: '3.12', linkage: COMPONENTS}
          - {os: ubuntu-24.04, llvm: 23, python: '3.12', linkage: COMPONENTS}
          - {os: macos-14, llvm: 17, python: '3.12', linkage: AUTO}
          - {os: macos-14, llvm: 23, python: '3.12', linkage: AUTO}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the selected LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo /tmp/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor < /tmp/llvm.asc | sudo tee /usr/share/keyrings/icg-llvm.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/icg-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm }} main' \
            | sudo tee /etc/apt/sources.list.d/icg-llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}-dev \
            libclang-${{ matrix.llvm }}-dev libclang-cpp${{ matrix.llvm }}-dev
          echo "LLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm" >> "$GITHUB_ENV"
          mkdir -p build/icg-evidence
          dpkg-query -W > build/icg-evidence/packages.txt
      - name: Install the selected LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icg-evidence
          formula=llvm@${{ matrix.llvm }}
          if [ '${{ matrix.llvm }}' = 23 ]; then
            # Freeze the official recipe and bottle checksums; llvm@23 is a
            # rolling alias until Homebrew introduces a versioned formula.
            brew tap-new --no-git icg/llvm23
            recipe="$(brew --repository icg/llvm23)/Formula/llvm.rb"
            curl -fsSLo "$recipe" https://raw.githubusercontent.com/Homebrew/homebrew-core/5871454bad1c28a2de49bc06ace5b76c9fb2b84c/Formula/l/llvm.rb
            echo "51fc938e20a84f18df1cfc0e2820415b64250517d0ae2a1ed878a178f75b8bcb  $recipe" | shasum -a 256 --check
            cp "$recipe" build/icg-evidence/llvm.rb
            formula=icg/llvm23/llvm
          fi
          brew install --force-bottle "$formula"
          echo "LLVM_DIR=$(brew --prefix "$formula")/lib/cmake/llvm" >> "$GITHUB_ENV"
          brew info --json=v2 "$formula" > build/icg-evidence/packages.json
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Configure and build standalone extractor
        run: |
          LLVM_PREFIX="$(cd "$LLVM_DIR/../../.." && pwd)"
          "$LLVM_PREFIX/bin/llvm-config" --version | tee build/icg-evidence/llvm-version.txt
          test "$("$LLVM_PREFIX/bin/llvm-config" --version | cut -d. -f1)" = '${{ matrix.llvm }}'
          "$LLVM_PREFIX/bin/clang" --version > build/icg-evidence/clang-version.txt
          cmake -S trick_source/codegen/TrickCodeGen -B build/icg-extract \
            -DLLVM_DIR="$LLVM_DIR" -DPython3_EXECUTABLE="$(command -v python)" \
            -DICG_CLANG_LINKAGE=${{ matrix.linkage }} \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/icg-extract --parallel 2
      - name: Test actual extraction and failure paths
        run: ctest --test-dir build/icg-extract --output-on-failure
      - name: Capture diagnostic and fail-closed version evidence
        run: |
          python tools/icg_schema/capture_diagnostics.py \
            --extractor build/icg-extract/trick-icg-extract \
            --output build/icg-evidence/diagnostics
      - name: Capture and validate facts fixtures
        run: |
          for fixture in record structured contexts enums-bitfields inheritance callables templates linkage; do
            build/icg-extract/trick-icg-extract \
              "trick_source/codegen/TrickCodeGen/tests/fixtures/$fixture.hh" -- \
              > "build/icg-extract/$fixture.json"
            python tools/icg_schema/validate.py \
              --schema trick_source/codegen/TrickCodeGen/ir/extracted-facts.schema.json \
              "build/icg-extract/$fixture.json"
          done
          python -m unittest discover -s tools/icg_schema -v
      - name: Compare compiled legacy metadata with facts and native layout
        if: matrix.os == 'ubuntu-24.04' && matrix.llvm == 17 && matrix.python == '3.11'
        run: |
          python tools/icg_baseline/differential.py \
            --extractor build/icg-extract/trick-icg-extract \
            --compiler "$(command -v g++)" \
            --output build/icg-evidence/legacy-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extracted-facts-llvm-${{ matrix.llvm }}-${{ matrix.os }}-python-${{ matrix.python }}-${{ matrix.linkage }}
          path: |
            build/icg-evidence
            build/icg-extract/CMakeCache.txt
            build/icg-extract/Testing/Temporary/LastTest.log
            build/icg-extract/record.json
            build/icg-extract/structured.json
            build/icg-extract/contexts.json
            build/icg-extract/enums-bitfields.json
            build/icg-extract/inheritance.json
            build/icg-extract/callables.json
            build/icg-extract/templates.json
            build/icg-extract/linkage.json
          if-no-files-found: error
          retention-days: 30

  compare-versions:
    name: Exact fixture graphs / ${{ matrix.os }} / LLVM 17–23
    needs: extractor
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - uses: actions/download-artifact@v8
        with:
          pattern: extracted-facts-llvm-*-${{ matrix.os }}-python-3.11-AUTO
          path: build/version-facts
      - name: Require all seven frontends and compare every fixture
        run: |
          lanes=()
          for major in 17 18 19 20 21 22 23; do
            lanes+=(--lane "$major=build/version-facts/extracted-facts-llvm-$major-${{ matrix.os }}-python-3.11-AUTO")
          done
          python tools/icg_schema/compare_versions.py \
            --schema trick_source/codegen/TrickCodeGen/ir/extracted-facts.schema.json \
            "${lanes[@]}" > build/version-comparison.json
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: exact-graph-comparison-${{ matrix.os }}
          path: build/version-comparison.json
          if-no-files-found: error
          retention-days: 30

  gcc-host:
    name: LLVM 17 / GCC ${{ matrix.gcc }} / Rocky Linux 8
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gcc: ['8.5', '12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 17 and host build dependencies
        run: |
          # The rolling llvm-toolset module now selects a newer LLVM. Require
          # the retained 17.0.6 packages explicitly and bypass module filtering.
          dnf -y --setopt=appstream.module_hotfixes=true install \
            gcc gcc-c++ make cmake python3.11 python3.11-pip \
            llvm-17.0.6 llvm-devel-17.0.6 llvm-static-17.0.6 \
            clang-17.0.6 clang-devel-17.0.6 clang-tools-extra-17.0.6
          if [ '${{ matrix.gcc }}' = 12 ]; then
            dnf -y install gcc-toolset-12-gcc gcc-toolset-12-gcc-c++
          fi
          python3.11 -m pip install 'jsonschema>=4.18,<5'
      - name: Verify compiler versions and build with warnings as errors
        run: |
          if [ '${{ matrix.gcc }}' = 12 ]; then
            source /opt/rh/gcc-toolset-12/enable
          fi
          gcc --version
          clang --version
          case "$(gcc -dumpfullversion)" in
            '${{ matrix.gcc }}'.*) ;;
            *) echo 'Unexpected GCC version'; exit 1 ;;
          esac
          test "$(llvm-config --version)" = 17.0.6
          cmake -S trick_source/codegen/TrickCodeGen -B build/icg-gcc \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DCMAKE_C_COMPILER="$(command -v gcc)" \
            -DCMAKE_CXX_COMPILER="$(command -v g++)" \
            -DPython3_EXECUTABLE="$(command -v python3.11)" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/icg-gcc --parallel 2
          ctest --test-dir build/icg-gcc --output-on-failure
