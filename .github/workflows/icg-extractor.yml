name: ICG extractor

on:
  push:
    branches: [master, icg-rewrite]
    paths:
      - 'trick_source/codegen/TrickCodeGen/**'
      - 'tools/icg_schema/**'
      - '.github/workflows/icg-extractor.yml'
  pull_request:
    paths:
      - 'trick_source/codegen/TrickCodeGen/**'
      - 'tools/icg_schema/**'
      - '.github/workflows/icg-extractor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extractor:
    name: LLVM 17 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install LLVM 17 on Linux
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 17 all
          echo "LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Install LLVM 17 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@17
          echo "LLVM_DIR=$(brew --prefix llvm@17)/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Configure and build standalone extractor
        run: |
          cmake -S trick_source/codegen/TrickCodeGen -B build/icg-extract \
            -DLLVM_DIR="$LLVM_DIR" -DPython3_EXECUTABLE="$(command -v python)" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/icg-extract --parallel 2
      - name: Test actual extraction and failure paths
        run: ctest --test-dir build/icg-extract --output-on-failure
      - name: Capture and validate first real facts
        run: |
          build/icg-extract/trick-icg-extract \
            trick_source/codegen/TrickCodeGen/tests/fixtures/record.hh -- \
            > build/icg-extract/record.json
          python tools/icg_schema/validate.py \
            --schema trick_source/codegen/TrickCodeGen/ir/extracted-facts.schema.json \
            build/icg-extract/record.json
          python -m unittest discover -s tools/icg_schema -v
      - uses: actions/upload-artifact@v7
        with:
          name: extracted-facts-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/icg-extract/record.json
          if-no-files-found: error
          retention-days: 30
