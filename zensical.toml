[project.theme]
custom_dir = "tools/docs/overrides"
font = false
logo = "images/TrickLogo.png"
features = [
    "navigation.tabs", "navigation.tabs.sticky", "navigation.footer",
    "navigation.sections", "navigation.indexes", "navigation.path",
    "navigation.top", "toc.follow", "content.code.copy",
    "content.action.edit", "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
"pymdownx.highlight" = {}
"pymdownx.superfences" = {}
# Preserve GFM strikethrough in the Python variable-server guides.
"pymdownx.tilde" = { subscript = false }

[project.plugins.search]
# Keep identifiers and command names intact; split shell ${...} wrappers.
separator = '[\s,:!=\[\]()\\"`/${}]+|\.(?!\d)'

[project.validation]
# Step 2: the complete corpus must pass strict validation in CI.
# Published legacy URL/heading-ID evidence remains a separate cutover gate.
invalid_links = true
invalid_link_anchors = true
