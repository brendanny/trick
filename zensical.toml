# Migration pilot only. GitHub Pages continues to use docs/_config.yml.
[project]
site_name = "Trick Documentation"
site_description = "Trick simulation environment documentation — Zensical migration pilot"
site_url = "https://nasa.github.io/trick/"
# Generated by tools/docs/build.py; docs/ remains the only authored source.
# Zensical 0.0.59 does not implement exclude_docs.
docs_dir = ".docs-build/source"
site_dir = "site"
use_directory_urls = false
nav = [
    { "Home" = "index.md" },
    { "Install guide" = "documentation/install_guide/Install-Guide.md" },
    { "Tutorial" = "tutorial/Tutorial.md" },
    { "User guide" = "documentation/Documentation-Home.md" },
    { "How-to guides" = "howto_guides/How-To-Guides.md" },
    { "Developer guide" = "developer_docs/Developer-Docs-Home.md" },
    { "FAQ" = "faq/FAQ.md" },
]

[project.theme]
font = false
logo = "images/TrickLogo.png"
features = ["content.code.copy"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
"pymdownx.highlight" = {}
"pymdownx.superfences" = {}

[project.validation]
# Report corpus compatibility work during step 1; do not suppress it.
# A strict full-corpus build becomes mandatory before the publishing cutover.
invalid_links = true
invalid_link_anchors = true
